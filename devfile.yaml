---
schemaVersion: 2.2.2
metadata:
  name: ansible-demo
components:
  - name: tooling-container
    container:
      image: ghcr.io/ansible/ansible-devspaces@sha256:f833103c12adf6ecb3cc8245dbc2d852ec5025c8c487d601b96995ea8783fb2f
      memoryRequest: 256M
      memoryLimit: 6Gi
      cpuRequest: 250m
      cpuLimit: 2000m
      args: ['tail', '-f', '/dev/null']
      env:
        - name: 'ANSIBLE_COLLECTIONS_PATH'
          value: '~/.ansible/collections:/usr/share/ansible/collections:/projects/ansible-devspaces-demo/collections'
        - name: 'KUBEDOCK_ENABLED'
          value: "true"

commands:

- id: install-module
    exec:
      label: install-module
      component: tooling-container
      commandLine: "pip install -e ."
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true

- id: build-galaxy
    exec:
      label: build-galaxy
      component: tooling-container
      commandLine: "ansible-galaxy collection build --force"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true

- id: sanity
    exec:
      label: sanity
      component: tooling-container
      commandLine: "ansible-test sanity"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true
        
- id: units
    exec:
      label: units
      component: tooling-container
      commandLine: "ansible-test units"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true
        
- id: integration
    exec:
      label: integration
      component: tooling-container
      commandLine: "ansible-test integration"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true
        
- id: coverage
    exec:
      label: coverage
      component: tooling-container
      commandLine: "ansible-test coverage"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true

- id: playbook
    exec:
      label: playbook
      component: tooling-container
      commandLine: "ansible-playbook --cdcp collection_doc_cache.db"
      workingDir: "${CHE_PROJECTS_ROOT}/ansible-collection-template/ansible_collections/namespace_example/collection_example"
      group:
        kind: run
        isDefault: true
